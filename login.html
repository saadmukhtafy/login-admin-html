
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin-Tugas</title>
    <link rel="stylesheet" href="login.css">

</head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<body>
   
    <div class="login-container">

        <div class="logo">
            <img src="logo.jpg" alt="Logo Admin">
        </div>

        <h2>Login Admin</h2>
        <p>Silakan masukkan username dan password admin</p>

        <form action="masuk.html">
            <!-- ini untuk menentukan login ini masuk kebagian mana ? -->
            <label>Username</label>
            <input type="text" placeholder="Masukkan username" required>
            <!-- required = ini supaya user wajib diisi -->
            <label>Password</label>
            <input type="password" placeholder="Masukkan password" required>

            <button type="submit">Login</button>

        </form>

    </div>

</body>
</html>
